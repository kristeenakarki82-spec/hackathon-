<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Pomu • Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="light">
  <div class="login-shell">
    <form id="loginForm" class="login-card" novalidate>
      <h1>Welcome back.</h1>
      <p class="login-subtitle">Sign in to continue your smarter study routine and keep your Pomu plan on track.</p>
      <input id="email" type="email" placeholder="Email" required />
      <input id="password" type="password" placeholder="Password" required />
      <button type="submit">Sign in</button>

      <div class="login-footer">
        <p>“The best way to learn is to start again with a better plan.”</p>
        <p>New here? <a href="index.html">Start your free session</a></p>
      </div>
    </form>
  </div>
  <script src="script.js"></script>
  <script src="auth.js"></script>
  <script>
    const loginForm = document.getElementById('loginForm');

    loginForm.addEventListener('submit', function (event) {
      event.preventDefault();
      const email = loginForm.querySelector("input[type='email']").value.trim();

      if (!email) {
        alert('Please enter email');
        return;
      }

      const userData = {
        email,
        avatar: email.charAt(0).toUpperCase(),
        loggedIn: true,
        sessions: [],
      };

      localStorage.setItem('pomuUser', JSON.stringify(userData));
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
